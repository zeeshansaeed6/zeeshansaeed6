<svg xmlns="http://www.w3.org/2000/svg" width="490" height="290" viewBox="0 0 490 290" role="img" aria-label="FoodDash: Multi-app food delivery platform. Group ordering with split billing, plus a real-time engine that matches surplus restaurant food with nearby demand. Checkout: about 40% faster. Built with: MERN, React Native.">
